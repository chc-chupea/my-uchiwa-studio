<!DOCTYPE html>
<html lang="ja">
<head>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Kosugi+Maru&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <title>Myうちわ - アップロード版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Kosugi Maru', sans-serif;
      background: linear-gradient(135deg, #fefefe, #e3f2fd); /* 明るい青系 */
      text-align: center;
      margin: 0;
      padding: 8px;
      color: #333;
    }
    
    /* ←ここに追加 */
    #customFileLabel {
      background: #ff9800; /* オレンジ */
      color: #fff;
      border-radius: 30px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
      display: inline-block;
      }
    #customFileLabel:hover {
      background: #e67e22; /* 濃いオレンジに変化 */
      transform: scale(1.05);
    }


    #saveBtn, #go-to-form {
      background: #4cafef;
      color: white;
      font-size: 18px;
      padding: 14px 28px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 15px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.3s;
    }

    #saveBtn:hover, #go-to-form:hover {
      background: #2196f3;
      transform: translateY(-3px);
    }

    #canvasWrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      background-color: #f4f4f4;
    }
    
    /* ←ここに追加 */
    #previewWrapper img {
      border: 6px solid #fff;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    #mainCanvas {
      width: 100%;
      height: auto;
      background-color: white;
      touch-action: none;
    }
    #templateSelector, #imageLoader, #saveBtn {
      margin-top: 10px;
      font-size: 14px;
    }

    #imageLoader {
      font-size: 14px;      /* 文字サイズを大きく */
    }

    #langButtons button {
      margin: 0 5px;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    #notice {
      margin-top: 10px;
      font-size: 12px;
      color: green;
    }

    h1#title {
      font-size: 28px;
      font-weight: bold;
      color: #ff4081; /* ピンク */
      text-shadow: 1px 1px 0 #fff, 2px 2px 4px rgba(0,0,0,0.2);
      margin: 20px 0;
    }

    @media print {
      body *:not(.fan-print) {
        display: none !important;
      }




      #mainCanvas {
        width: 100%;
        height: auto;
      }
      canvas {
        page-break-inside: avoid;
        break-inside: avoid;
        -webkit-region-break-inside: avoid;
      }
    }

    #go-to-form {
      font-size: 18px;
      padding: 12px 24px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.3s;
      margin-top: 20px;
    }

    #go-to-form:hover {
      background-color: #45a049;
    }

    #go-to-form:active {
      transform: scale(0.96);
    }

    #templateLabel {
      font-size: 18px;  /* ←ここでサイズ変更 */
      font-weight: bold; /* 太字にしたい場合 */
      }

    /* ←この下に追記 */
    button {
      background: #4cafef;
      color: white;
      font-size: 16px;
      padding: 12px 24px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      background: #2196f3;
      transform: translateY(-2px);
    }
  </style>
</head>

  <div id="canvasWrapper">

  <button id="saveBtn"
    data-ja="決定 → プレビュー"

  <!-- ここが新しい案内文表示領域 -->

</div>

  <!-- 注文フォームへ進むボタン（最初は非表示） -->

  <footer id="footer-text" style="font-size: 6px; color: #888; margin-top: 20px;"

  <script>
    const saveWarningTexts = {
      ja: '⚠️ まだファイルが選ばれていません。うちわに使う画像を選んでください。',
      en: '⚠️ No file selected yet. Please upload an image.',
      zh: '⚠️ 尚未选择文件，请上传图片。',
      ko: '⚠️ 아직 파일이 선택되지 않았습니다. 이미지를 업로드하세요.',
      vi: '⚠️ Chưa chọn tệp. Vui lòng tải ảnh lên.',
    };
    
    let currentLang = 'ja'; // デフォルトは日本語
    
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let uploadedImg = null;
    let imgX = 100, imgY = 100, scale = 1, rotation = 0;
    let isDragging = false, lastX, lastY;

    const templateSelector = document.getElementById('templateSelector');
    let templateImg = new Image();
    templateImg.src = templateSelector.value;

    templateSelector.addEventListener('change', () => {
      templateImg.src = templateSelector.value;
      draw();
    });

    templateImg.onload = () => draw();

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (uploadedImg) {
        ctx.save();
        ctx.translate(imgX, imgY);
        ctx.rotate(rotation);
        ctx.scale(scale, scale);
        ctx.drawImage(uploadedImg, -uploadedImg.width / 2, -uploadedImg.height / 2);
        ctx.restore();
      }
      if (templateImg.complete) {
        ctx.drawImage(templateImg, 0, 0, canvas.width, canvas.height);
      }
    }

    document.getElementById('imageLoader').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedImg = new Image();
        uploadedImg.onload = () => {
          imgX = canvas.width / 2;
          imgY = canvas.height / 2;
          scale = 1;
          rotation = 0;
          draw();
        };
        uploadedImg.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      lastX = e.offsetX;
      lastY = e.offsetY;
    });

    canvas.addEventListener('mousemove', e => {
      if (isDragging && uploadedImg) {
        imgX += e.offsetX - lastX;
        imgY += e.offsetY - lastY;
        lastX = e.offsetX;
        lastY = e.offsetY;
        draw();
      }
    });

    canvas.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('wheel', e => {
      if (uploadedImg) {
        scale += e.deltaY * -0.001;
        scale = Math.max(0.1, Math.min(5, scale));
        draw();
      }
      e.preventDefault();
    });

    // ←→キーで回転
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') rotation -= 0.05;
      if (e.key === 'ArrowRight') rotation += 0.05;
      draw();
    });

// ---------- 保存ボタンの新しい処理（ここに置き換える） ----------
document.getElementById('saveBtn').addEventListener('click', () => {
  const noticeEl = document.getElementById('notice');

  if (!uploadedImg) {
    noticeEl.textContent = saveWarningTexts[currentLang] || saveWarningTexts['ja'];
    noticeEl.style.color = 'red';
    setTimeout(() => {
      noticeEl.textContent = '';
      noticeEl.style.color = 'green';
    }, 3000);
    return;
  }

  // canvas を Blob にしてプレビュー表示（長押しで保存する方式）
  canvas.toBlob(blob => {
    const errorTexts = {
      ja: '画像作成に失敗しました。もう一度お試しください。',
      en: 'Failed to create image. Please try again.',
      zh: '生成图像失败。请再试一次。',
      ko: '이미지 생성에 실패했습니다. 다시 시도해주세요.',
      vi: 'Tạo hình ảnh thất bại. Vui lòng thử lại.'
    };

    if (!blob) {
      noticeEl.textContent = errorTexts[currentLang] || errorTexts['ja'];
      noticeEl.style.color = 'red';
      return;
    }

    // 前の object URL があれば解放
    if (window._lastPreviewURL) {
      try { URL.revokeObjectURL(window._lastPreviewURL); } catch (e) {}
      window._lastPreviewURL = null;
    }

    const url = URL.createObjectURL(blob);
    window._lastPreviewURL = url;

    // プレビュー要素を表示
    const previewWrapper = document.getElementById('previewWrapper');
    const previewImg = document.getElementById('previewImage');
    previewImg.src = url;
    previewWrapper.style.display = 'block';

    const previewNotice = document.getElementById('previewNotice');
    const previewNoticeTexts = {
      ja: `iPhone：画像を👆長押しして「“写真”に追加」を選んで保存してください。<br><br>
           Android：画像を👆長押しして「画像を保存」を選択してください。<br><br>
           保存できたら下の「注文フォームへ進む」ボタンから申込へお進みください。`,
      en: `iPhone: Press and hold 👆 the image, then select "Add to Photos" to save.<br><br>
           Android: Press and hold 👆 the image, then select "Save Image".<br><br>
           After saving, proceed to the order form below.`,
      zh: `iPhone：长按👆图片，然后选择“添加到照片”进行保存。<br><br>
           Android：长按👆图片，然后选择“保存图片”。<br><br>
           保存后，请点击下面的“前往订单表单”。`,
      ko: `iPhone: 이미지를 👆 길게 눌러 "사진에 추가"를 선택하세요.<br><br>
           Android: 이미지를 👆 길게 눌러 "이미지 저장"을 선택하세요.<br><br>
           저장 후 아래의 "주문 양식으로 이동" 버튼을 눌러 진행하세요.`,
      vi: `iPhone: Nhấn và giữ 👆 hình, chọn "Thêm vào Ảnh" để lưu.<br><br>
           Android: Nhấn và giữ 👆 hình, chọn "Lưu hình ảnh".<br><br>
           Sau khi lưu, hãy bấm nút "Đi tới Form đặt hàng" bên dưới.`
    };

    previewNotice.innerHTML = previewNoticeTexts[currentLang] || previewNoticeTexts['ja'];

    // スクロールして目立たせる
    previewWrapper.scrollIntoView({ behavior: 'smooth' });

  }, 'image/png'); // PNG で生成
});
// -------------------------------------------------------------------

    // --- タッチ操作用変数 ---
    let lastTouchDist = null;
    let lastTouchAngle = null;
    canvas.addEventListener('touchstart', e => {
      if (!uploadedImg) return;

      if (e.touches.length === 1) {
        isDragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }

      if (e.touches.length === 2) {
        isDragging = false;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        lastTouchDist = Math.hypot(dx, dy);
        lastTouchAngle = Math.atan2(dy, dx);
      }

      e.preventDefault();
    });

    canvas.addEventListener('touchmove', e => {
      if (!uploadedImg) return;

      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - lastX;
        const dy = e.touches[0].clientY - lastY;
        imgX += dx;
        imgY += dy;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        draw();
      }

      if (e.touches.length === 2) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const newDist = Math.hypot(dx, dy);
        const newAngle = Math.atan2(dy, dx);

        // スケーリング
        if (lastTouchDist !== null) {
          const scaleChange = newDist / lastTouchDist;
          scale *= scaleChange;
          scale = Math.max(0.1, Math.min(5, scale));
        }

        // 回転
        if (lastTouchAngle !== null) {
          const angleChange = newAngle - lastTouchAngle;
          rotation += angleChange;
        }

        lastTouchDist = newDist;
        lastTouchAngle = newAngle;
        draw();
      }

      e.preventDefault();
    });

    canvas.addEventListener('touchend', e => {
      if (e.touches.length < 2) {
        lastTouchDist = null;
        lastTouchAngle = null;
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
      e.preventDefault();
    });

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-ja]').forEach(el => {
        if (el.dataset[lang]) {
          if (el.tagName === "OPTION" || el.tagName === "BUTTON" || el.tagName === "LABEL") {
            el.textContent = el.dataset[lang]; // ボタン・ラベル・セレクト用
          } else {
            el.innerHTML = el.dataset[lang];   // h1やpなど
          }
        }
      });
    }
    
    function getTimestampBasedFileName() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      const h = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const slot = Math.floor(parseInt(min) / 30) * 30;
      const slotStr = String(slot).padStart(2, '0');
      return `uchiwa_${y}${m}${d}_${h}${slotStr}.png`;
    }

    // 📌 フォームへ進むボタンクリック時の処理
    document.getElementById('go-to-form').addEventListener('click', function () {
        window.location.href = "https://docs.google.com/forms/d/e/1FAIpQLSf1wV724Vnag4FCcjeU1z-3vaCcfhCjAvGyU8432bu8dyciow/viewform";

        // 念のため5秒後に手動リンクを表示
        setTimeout(() => {
            document.getElementById('manual-link').style.display = 'block';
        }, 5000);
    });
    
    window.addEventListener('load', () => {
      const userLang = navigator.language || navigator.userLanguage;
      if (userLang.startsWith('en')) setLanguage('en');
      else if (userLang.startsWith('zh')) setLanguage('zh');
      else if (userLang.startsWith('ko')) setLanguage('ko');
      else if (userLang.startsWith('vi')) setLanguage('vi');
      else setLanguage('ja');
    });
  </script>
</body>
</html>
